<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline, blocking, zero network cost — parses/paints before the
         Vite-injected index.css (which only lands after main.tsx's JS
         module graph resolves) or the Google Fonts link even reach the
         browser. This is the ONLY way to guarantee there is no white
         frame: background-color rules living in index.css are always
         too late for the very first paint, no matter how they're
         written. Keep this in sync with the #F5F5E9 in index.css. -->
    <style>
      html, body, #root { background-color: #F5F5E9; }
      html { color-scheme: light; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GyftKart — Premium E-Gift Card Marketplace</title>
    <meta name="description" content="GyftKart — India's premium marketplace for e-gift cards. Send personalized gift cards for Amazon, Flipkart, Myntra, Nykaa and 100+ brands for birthdays, weddings & festivals." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
