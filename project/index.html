<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline, blocking, zero network cost — parses/paints before the
         Vite-injected index.css (which only lands after main.tsx's JS
         module graph resolves) or the Google Fonts link even reach the
         browser. This is the ONLY way to guarantee there is no white
         frame: background-color rules living in index.css are always
         too late for the very first paint, no matter how they're
         written. Keep this in sync with the #F5F5E9 in index.css. -->
    <style>
      html, body, #root { background-color: #F5F5E9; }
      html { color-scheme: light; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary SEO Meta Tags -->
    <title>GyftKart | India's Leading Digital E-Gift Cards &amp; Instant UPI Vouchers</title>
    <meta
      name="title"
      content="GyftKart | India's Leading Digital E-Gift Cards &amp; Instant UPI Vouchers"
    />
    <meta
      name="description"
      content="Buy e-gift cards and vouchers instantly with UPI Direct on GyftKart. Top brand discounts, secure digital wallet, and fast delivery for corporate &amp; personal gifting."
    />
    <meta
      name="keywords"
      content="e-gift cards, digital vouchers, UPI gift card, instant gift vouchers India, buy gift cards online, corporate gifting, Amazon gift voucher, Flipkart voucher, Myntra card, Swiggy voucher, Zomato gift cards, GyftKart"
    />
    <meta name="author" content="GyftKart Technologies" />
    <link rel="canonical" href="https://gyftkart.in/" />

    <!-- Crawlers & Search Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#15803d" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GyftKart" />
    <meta property="og:url" content="https://gyftkart.in/" />
    <meta
      property="og:title"
      content="GyftKart | India's Leading Digital E-Gift Cards &amp; Instant UPI Vouchers"
    />
    <meta
      property="og:description"
      content="Buy e-gift cards and vouchers instantly with UPI Direct on GyftKart. Top brand discounts, secure digital wallet, and fast delivery for corporate &amp; personal gifting."
    />
    <meta property="og:image" content="https://gyftkart.in/images/banners/gift-card-rewards.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GyftKart Digital E-Gift Cards &amp; Instant UPI Vouchers" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@GyftKart" />
    <meta name="twitter:creator" content="@GyftKart" />
    <meta property="twitter:url" content="https://gyftkart.in/" />
    <meta
      name="twitter:title"
      content="GyftKart | India's Leading Digital E-Gift Cards &amp; Instant UPI Vouchers"
    />
    <meta
      name="twitter:description"
      content="Buy e-gift cards and vouchers instantly with UPI Direct on GyftKart. Top brand discounts, secure digital wallet, and fast delivery for corporate &amp; personal gifting."
    />
    <meta name="twitter:image" content="https://gyftkart.in/images/banners/gift-card-rewards.png" />
    <meta name="twitter:image:alt" content="GyftKart Digital E-Gift Cards &amp; Instant UPI Vouchers" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) - Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GyftKart",
        "alternateName": "GyftKart Technologies",
        "url": "https://gyftkart.in",
        "logo": "https://gyftkart.in/images/banners/amazon-gift-card.png",
        "description": "India's leading digital e-gift cards and instant UPI voucher marketplace for retail and corporate gifting.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9876543210",
          "contactType": "Customer Support",
          "email": "support@gyftkart.in",
          "areaServed": "IN",
          "availableLanguage": ["English", "Hindi"]
        },
        "sameAs": [
          "https://twitter.com/GyftKart",
          "https://www.linkedin.com/company/gyftkart",
          "https://www.instagram.com/gyftkart"
        ]
      }
    </script>

    <!-- Structured Data (JSON-LD) - WebSite & Sitelinks Searchbox -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GyftKart",
        "url": "https://gyftkart.in",
        "description": "India's Leading Digital E-Gift Cards & Instant UPI Vouchers",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://gyftkart.in/brands?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
